[project]
name = "llm-doctor"
version = "0.1.0"
description = "brew doctor for your local AI setup: duplicate weights, stale chat templates, orphan blobs, Ollama export, and an agent-readiness probe for local endpoints."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur", email = "levi74108520963@gmail.com" }]
requires-python = ">=3.10"
keywords = ["llm", "ollama", "llama.cpp", "lm-studio", "mlx", "gguf", "huggingface", "local-ai", "doctor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx==0.28.1",
    "rich==15.0.0",
    "typer==0.27.2",
]

[project.urls]
Homepage = "https://github.com/Arthur031221/llm-doctor"
Issues = "https://github.com/Arthur031221/llm-doctor/issues"
Changelog = "https://github.com/Arthur031221/llm-doctor/blob/main/CHANGELOG.md"

[project.scripts]
llm-doctor = "llm_doctor.cli:main"

[dependency-groups]
dev = [
    "gguf==0.19.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_doctor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
